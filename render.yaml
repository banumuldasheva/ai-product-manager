databases:
  - name: ai-chat-db
    plan: free

services:
  - type: web
    name: ai-chat-app
    runtime: docker
    plan: free
    dockerfilePath: ./Dockerfile
    envVars:
      - key: GEMINI_API_KEY
        sync: false
      - key: TG_PROD
        sync: false
      - key: NODE_ENV
        value: production
      - key: DATABASE_URL
        fromDatabase:
          name: ai-chat-db
          property: connectionString
